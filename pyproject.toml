[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "md2pdf"
version = "1.0.0"
description = "Publication-quality Markdown to PDF converter with native Mermaid diagram rendering, rich table formatting, and executive styling."
readme = "README.md"
authors = [{ name = "DeWitt Clinton", email = "dewitt@google.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "reportlab>=4.0.0",
    "markdown>=3.5.0",
    "Pillow>=9.0.0",
    "svglib>=1.5.0",
    "matplotlib>=3.7.0",
]

[project.scripts]
md2pdf = "md2pdf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
